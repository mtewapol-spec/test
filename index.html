        let currentIndex = 0;
        let activeData = [];
        let score = 0;

        const cardContentArea = document.getElementById("card-content-area");
        const vocabDropdownBox = document.getElementById("vocab-dropdown-box");
        const cardCategory = document.getElementById("card-category");
        const counter = document.getElementById("counter");
        const progressBar = document.getElementById("progress-bar");
        const learningSection = document.getElementById("learning-section");
        const completeSection = document.getElementById("complete-section");
        const categorySelect = document.getElementById("category-select");

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById("btn-mode-vocab").classList.toggle("active", mode === 'vocab');
            document.getElementById("btn-mode-verbs").classList.toggle("active", mode === 'verbs');

            if (mode === 'vocab') {
                vocabDropdownBox.style.display = "block";
                loadCategoryData();
            } else {
                vocabDropdownBox.style.display = "none";
                activeData = shuffleArray(verbGameData);
                currentIndex = 0;
                score = 0;
            }
            learningSection.style.display = "block";
            completeSection.style.display = "none";
            updateCard();
        }

        function speakWord(wordText) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(wordText);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        function loadCategoryData() {
            const selectedCategory = categorySelect.value;
            activeData = shuffleArray(allLessonsData[selectedCategory]);
            currentIndex = 0;
            score = 0;
        }

        function updateCard() {
            if (currentIndex < activeData.length) {
                const progress = (currentIndex / activeData.length) * 100;
                progressBar.style.width = progress + '%';
                counter.textContent = `${currentIndex + 1} / ${activeData.length}`;

                if (currentMode === 'vocab') {
                    cardCategory.textContent = categorySelect.options[categorySelect.selectedIndex].text;
                    const item = activeData[currentIndex];
                    const correctAnswer = item.translation;

                    // สุ่มตัวเลือกคำแปลผิดมา 3 ข้อจากบทเดียวกันหรือภาพรวม
                    let pool = allLessonsData[categorySelect.value].filter(v => v.translation !== correctAnswer);
                    pool = shuffleArray(pool).slice(0, 3);
                    let options = [correctAnswer, ...pool.map(v => v.translation)];
                    options = shuffleArray(options);

                    cardContentArea.innerHTML = `
                        <div class="emoji-icon">${item.emoji}</div>
                        <div class="word-container">
                            <div class="word" id="card-word">${item.word}</div>
                            <button class="speaker-btn" onclick="speakWord('${item.word}')" title="ฟังเสียงอ่าน">🔊</button>
                        </div>
                        <div class="pos">${item.pos} — จงเลือกคำแปลที่ถูกต้อง</div>
                        <div class="options-grid">
                            ${options.map(opt => `<button class="option-btn" onclick="checkVocabAnswer(this, '${opt.replace(/'/g, "\\'")}', '${correctAnswer.replace(/'/g, "\\'")}')">${opt}</button>`).join('')}
                        </div>
                    `;
                    setTimeout(() => speakWord(item.word), 200);
                } else {
                    cardCategory.textContent = "⚡ เกมกิริยา 3 ช่อง";
                    const currentVerb = activeData[currentIndex];
                    const targetForm = Math.random() < 0.5 ? 'v2' : 'v3';
                    const targetLabel = targetForm === 'v2' ? 'ช่องที่ 2 (Past Tense)' : 'ช่องที่ 3 (Past Participle)';
                    const correctAnswer = currentVerb[targetForm];

                    let wrongOptions = verbGameData.filter(v => v[targetForm] !== correctAnswer);
                    wrongOptions = shuffleArray(wrongOptions).slice(0, 3);
                    let options = [correctAnswer, ...wrongOptions.map(v => v[targetForm])];
                    options = shuffleArray(options);

                    cardContentArea.innerHTML = `
                        <div style="font-size: 22px; font-weight: 700; color: #2d3748; margin-bottom: 2px;">${currentVerb.v1}</div>
                        <div style="font-size: 13px; color: #718096; margin-bottom: 4px;">ความหมาย: ${currentVerb.meaning}</div>
                        <div class="pos" style="color: #3182ce; margin-bottom: 12px;">หากิริยา ${targetLabel}</div>
                        <div class="options-grid">
                            ${options.map(opt => `<button class="option-btn" onclick="checkVerbAnswer(this, '${opt}', '${correctAnswer}')">${opt}</button>`).join('')}
                        </div>
                    `;
                }
            } else {
                learningSection.style.display = "none";
                completeSection.style.display = "flex";
                completeText.textContent = `ยอดเยี่ยมมาก! คุณเล่นจบรอบแล้ว (ทำคะแนนถูก ${score} จาก ${activeData.length} ข้อ)`;
            }
        }

        function checkVocabAnswer(btn, selected, correct) {
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.style.pointerEvents = 'none');

            if (selected === correct) {
                btn.classList.add('correct');
                score++;
            } else {
                btn.classList.add('wrong');
                allBtns.forEach(b => {
                    if (b.textContent === correct) b.classList.add('correct');
                });
            }

            setTimeout(() => {
                currentIndex++;
                updateCard();
            }, 1000);
        }

        function checkVerbAnswer(btn, selected, correct) {
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.style.pointerEvents = 'none');

            if (selected === correct) {
                btn.classList.add('correct');
                score++;
            } else {
                btn.classList.add('wrong');
                allBtns.forEach(b => {
                    if (b.textContent === correct) b.classList.add('correct');
                });
            }

            setTimeout(() => {
                currentIndex++;
                updateCard();
            }, 1000);
        }

        function changeCategory() {
            loadCategoryData();
            updateCard();
        }

        function restartSession() {
            if (currentMode === 'vocab') {
                loadCategoryData();
            } else {
                activeData = shuffleArray(verbGameData);
                currentIndex = 0;
                score = 0;
            }
            learningSection.style.display = "block";
            completeSection.style.display = "none";
            updateCard();
        }

        loadCategoryData();
        updateCard();
